name: Eneba Price Monitor

on:
  schedule:
    - cron: '0 0,* * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run monitor
        env:
          DISCORD_PROFITABLE_WEBHOOK_URL: ${{ secrets.DISCORD_PROFITABLE_WEBHOOK_URL }}
          DISCORD_RECAP_WEBHOOK_URL: ${{ secrets.DISCORD_RECAP_WEBHOOK_URL }}
        run: npm run dev

      - name: Commit updated data
        run: |
          git config user.name "eneba-monitor-bot"
          git config user.email "eneba-monitor-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(data): update Eneba monitor"
          git push